# 실배포 워크플로우
# main에 push될 때만 이미지를 빌드해 ECR에 push하고, ArgoCD가 배포

name: Calendar Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC로 ECR push용 IAM 역할을 assume하기 위해 필요

jobs:
  # calendar-service가 의존하는 study-service와의 계약 실제 응답 모양과 어긋나지 않는지 검증한다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run study-service client contract tests
        run: ./gradlew test --tests "*ContractTest" --tests "*TracePropagationTest" --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

  calendar-service:
    needs: contract-test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-ecr-role
          aws-region: ap-northeast-2

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push calendar-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            gpr_actor=${{ github.actor }}
            gpr_token=${{ secrets.GPR_TOKEN }}
          platforms: linux/arm64
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          tags: ${{ steps.ecr-login.outputs.registry }}/groovy-calendar-service:${{ github.sha }}
          cache-from: type=gha,scope=calendar-service
          cache-to: type=gha,mode=max,scope=calendar-service

      # 태그를 새로 push한 sha로 갱신해 커밋한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        id: bump
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/calendar-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/calendar-service/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(calendar-service): bump image tag to ${{ github.sha }}"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "infra_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # 자동 롤백(auto-rollback P5): 배포 후 groovy-infra의 deploy-verify를 트리거해 ArgoCD
      # 배포 health를 검증한다. 실패 시 groovy-infra 쪽 가드를 통과하면 자동 롤백된다.
      - name: Trigger deploy verification (auto-rollback)
        if: steps.bump.outputs.committed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KDT-Team26/groovy-infra/dispatches \
            -d "{\"event_type\":\"deploy-verify\",\"client_payload\":{\"service\":\"calendar-service\",\"infra_sha\":\"${{ steps.bump.outputs.infra_sha }}\"}}"

# TODO():
#   - CalendarServiceApplicationTests(@SpringBootTest 컨텍스트 로드 테스트)가 CI에 아직 안
#     붙어있다. 실제 MySQL/Kafka가 필요한데, 폴리레포 전환 계획서 6장 2단계(과도기)에서는
#     groovy-infra가 아직 없어 로컬/CI 통합 테스트가 원본 Groovy 레포의 docker-compose.local.yml에
#     의존하는 상태이므로, 이 서비스 레포 CI에서 테스트를 어떻게 돌릴지(서비스 컨테이너 도입 vs
#     계속 보류)는 그 정책이 정해진 뒤 채운다.
#   - event-contract(libs/event-contract) 발행 측 계약 테스트 없음: study-service와 동일한
#     이유(NotificationOutboxPublisher 참고) — 원본 모노레포부터 발행 측 계약 테스트가 없었고,
#     이번 격리(기계적 이관) 범위에서 새로 작성하지 않았다. 필요 여부는 팀 판단 필요.
#   - client-common의 UserServiceClient는 이 서비스가 실제로 쓰지 않는다(ClientCommonAutoConfiguration이
#     자동 등록하는 빈만 무해하게 존재). study-service 호출용 StudyServiceClient는 이 서비스
#     로컬 코드(services/calendar-service/.../client/StudyServiceClient.java)다.
name: Calendar Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # calendar-service가 의존하는 study-service와의 계약(StudyServiceClient, 이 서비스 로컬
  # 코드)이 실제 응답 모양과 어긋나지 않는지 검증한다. 로컬 스텁 HTTP 서버로 응답을 흉내내는
  # 순수 단위 테스트라 별도 인프라(DB/Redis/Kafka) 없이 돈다. --tests 필터를 루트 레벨로 걸어
  # libs:client-common과 libs:security-common의 계약 테스트도 함께 실행한다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run study-service client contract tests
        run: ./gradlew test --tests "*ContractTest" --no-daemon

  calendar-service:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push calendar-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            bebeghi/groovy-calendar-service:latest
            bebeghi/groovy-calendar-service:${{ github.sha }}
          cache-from: type=gha,scope=calendar-service
          cache-to: type=gha,mode=max,scope=calendar-service

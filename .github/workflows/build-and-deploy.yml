# Phase 06(Groovy GitOps 빌드 지시서) — main 실배포 CI. dev 전용 테스트 CI(contract-test.yml)와 달리
# main에 push될 때만 이미지를 빌드해 Docker Hub(ttt103 계정)에 push하고, groovy-infra의 배포
# 태그를 갱신한다. 이 워크플로가 CI(이미지 빌드)와 CD(ArgoCD가 groovy-infra의 main을 감시)를
# 잇는 연결고리다.
#
# TODO():
#   - CalendarServiceApplicationTests(@SpringBootTest 컨텍스트 로드 테스트)가 CI에 아직 안
#     붙어있다. 실제 MySQL/Kafka가 필요한데, groovy-infra와의 통합 테스트 인프라(서비스 컨테이너
#     도입 여부)가 아직 정해지지 않아 보류한다.
#   - event-contract(libs/event-contract) 발행 측 계약 테스트 없음: study-service와 동일한
#     이유 — 원본 모노레포부터 발행 측 계약 테스트가 없었고, 새로 추가할지는 팀 판단 필요.
#   - client-common의 UserServiceClient는 이 서비스가 실제로 쓰지 않는다(ClientCommonAutoConfiguration이
#     자동 등록하는 빈만 무해하게 존재). study-service 호출용 StudyServiceClient는 이 서비스
#     로컬 코드(services/calendar-service/.../client/StudyServiceClient.java)다.
name: Calendar Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # calendar-service가 의존하는 study-service와의 계약(StudyServiceClient, 이 서비스 로컬
  # 코드)이 실제 응답 모양과 어긋나지 않는지 검증한다. 로컬 스텁 HTTP 서버로 응답을 흉내내는
  # 순수 단위 테스트라 별도 인프라(DB/Redis/Kafka) 없이 돈다. --tests 필터를 루트 레벨로 걸어
  # libs:client-common과 libs:security-common의 계약 테스트도 함께 실행한다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run study-service client contract tests
        run: ./gradlew test --tests "*ContractTest" --no-daemon

  calendar-service:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push calendar-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          tags: ttt103/groovy-calendar-service:${{ github.sha }}
          cache-from: type=gha,scope=calendar-service
          cache-to: type=gha,mode=max,scope=calendar-service

      # 여기서부터 CD 연결 — groovy-infra의 main 브랜치에 있는 이 서비스의 values.yaml 이미지
      # 태그를 새로 push한 sha로 갱신해 커밋한다. ArgoCD가 groovy-infra main을 감시 중이므로,
      # 이 커밋 하나가 실제 클러스터 배포를 트리거한다. GITHUB_TOKEN은 이 레포에만 범위가 있어
      # 다른 레포에 못 쓰므로, groovy-infra 쓰기 권한이 있는 별도 PAT(INFRA_REPO_PAT)가 필요하다
      # — Docker Hub 토큰과 마찬가지로 레포 소유자가 직접 발급해서 시크릿으로 등록해야 한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/calendar-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/calendar-service/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore(calendar-service): bump image tag to ${{ github.sha }}"
            git push
          fi
